<div class="layout retail">
  <aside class="sidebar">
    <div class="logo">{{ companyName }}</div>
    <ul class="menu">
      <li *ngFor="let m of menus" (click)="navigate(m.path)">{{ m.label }}</li>
    </ul>
    <div class="bottom">
      <button (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h2>Retail Dashboard</h2>
      <div class="search"><input placeholder="Search product / barcode" /></div>
    </header>
    <section class="view"><router-outlet></router-outlet></section>
  </main>
</div>

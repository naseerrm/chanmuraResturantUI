<div class="restaurant-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="collapsed">
    <button class="toggle-btn" (click)="toggle()">☰</button>

    <nav class="menu">
      <ul>
        <li
  *ngFor="let m of menus"
  (click)="navigate(m.path)"
  class="menu-item"
  [class.active]="currentRoute === m.path"
  matTooltip="{{ collapsed ? m.label : '' }}"
  matTooltipPosition="right"
>
  <span class="icon">{{ m.icon }}</span>
  <span class="text">{{ m.label }}</span>
</li>

      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="content-area">

    <header class="topbar">
      <h2 class="page-title">{{ companyName$ | async }}</h2>

      <div class="user-profile">
        <img class="profile-img"
             [src]="user?.photoUrl || 'assets/images/default-avatar.jpeg'"
             alt="User Profile" />

        <div class="user-info">
          <span class="user-name">{{ user?.name || 'Guest User' }}</span>
          <span class="user-role">{{ user?.role || 'Staff' }}</span>
        </div>

        <div class="profile-dropdown">
          <button (click)="toggleDropdown()">▼</button>

          <ul *ngIf="dropdownOpen" class="dropdown-menu">
            <li (click)="goToProfile()">Profile</li>
            <li (click)="logout()">Logout</li>
          </ul>
        </div>
      </div>
    </header>

    <section class="content-view">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>

<app-loader [isLoading]="isLoading"></app-loader>

<!-- ⭐ FIXED FILTER PANEL (Will NOT Move on Scroll) -->
<div class="sticky-filter-panel shadow-sm">

  <div class="input-group search-box mb-3">
    <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
    <input 
      type="text"
      class="form-control"
      placeholder="Search items..."
      [(ngModel)]="searchText"
      (ngModelChange)="currentPage = 1"
    />
  </div>

  <div class="chips-wrapper mb-3">
    <span class="chip" [class.active]="selectedCategory==''" (click)="selectedCategory=''; currentPage=1">All</span>
    <span class="chip" [class.active]="selectedCategory=='Veg'" (click)="selectedCategory='Veg'; currentPage=1">🌱 Veg</span>
    <span class="chip" [class.active]="selectedCategory=='Non-Veg'" (click)="selectedCategory='Non-Veg'; currentPage=1">🍗 Non-Veg</span>
  </div>

  <div class="row g-3 filters-row">
    <div class="col-md-3"><input type="number" class="form-control" placeholder="Min Price" [(ngModel)]="minPrice"></div>
    <div class="col-md-3"><input type="number" class="form-control" placeholder="Max Price" [(ngModel)]="maxPrice"></div>
    <div class="col-md-3">
      <select class="form-select" [(ngModel)]="sortOrder">
        <option value="">Sort By</option>
        <option value="asc">Low → High</option>
        <option value="desc">High → Low</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" [(ngModel)]="availabilityFilter">
        <option value="">All Items</option>
        <option value="in">In Stock</option>
        <option value="out">Out of Stock</option>
      </select>
    </div>
  </div>

</div>


<div class="page-content">

  <!-- ⭐ Sticky Search + Filters Panel -->
  
  <!-- Title -->
  <h3 class="fw-bold mt-4">🍽️ Menu Items</h3>

  <!-- Grid -->
  <div class="row g-4 mt-2">
    <div *ngFor="let item of paginatedItems()" class="col-lg-3 col-md-4 col-sm-6">

      <div class="card item-card shadow-sm">
        
        <!-- Image -->
        <div class="image-container">
          <img 
            [src]="item.imageUrl || 'assets/default.jpg'" 
            (error)="onImageError($event)"
            class="menu-img"
          />
          <span *ngIf="item.quantityAvailable === 0" class="stock-badge">Out of Stock</span>
        </div>

        <div class="card-body">
          <h6 class="fw-bold">{{ item.name }}</h6>
          <p class="price">₹{{ item.price }}</p>

          <!-- Quantity -->
          <div class="qty-box">
            <button class="btn minus" [disabled]="item.quantityAvailable === 0" (click)="decreaseQuantity(item)">–</button>
            <span>{{ item.quantity || 0 }}</span>
            <button class="btn plus" [disabled]="item.quantityAvailable === 0" (click)="increaseQuantity(item)">+</button>
          </div>

        </div>

      </div>

    </div>
  </div>

</div>

<!-- Pagination -->
<div class="pagination-container">
  <button class="page-btn" [disabled]="currentPage===1" (click)="previousPage()">← Previous</button>
  <span class="page-info">Page {{currentPage}} of {{totalPages}}</span>
  <button class="page-btn" [disabled]="currentPage===totalPages" (click)="nextPage()">Next →</button>
</div>

<!-- Floating Cart Bar -->
<div class="cart-float" *ngIf="cartItemCount > 0">
  <span class="fw-bold">🛒 {{ cartItemCount }} item(s) in cart</span>
  <button class="btn btn-success" (click)="viewCart()">View Cart →</button>
</div>

  <!-- CART SECTION -->
  <div class="cart-section shadow-lg" *ngIf="cartItems.length > 0">

    <h5 class="fw-bold mb-3">🛒 Your Cart</h5>

    <div *ngFor="let cartItem of cartItems" class="cart-item">
      <div>
        <p class="fw-bold">{{ cartItem.menuItem.name }}</p>
        <p class="text-muted small">₹{{ cartItem.menuItem.price }}</p>
      </div>

      <div class="d-flex align-items-center">
        <button class="btn btn-sm btn-light" (click)="decreaseQuantity(cartItem)">–</button>
        <span class="mx-2">{{ cartItem.quantity }}</span>
        <button class="btn btn-sm btn-light" (click)="increaseQuantity(cartItem)">+</button>
      </div>
    </div>

    <div class="cart-summary mt-4">
      <div class="d-flex justify-content-between fw-bold">
        <span>Total</span><span>₹{{ cartTotal }}</span>
      </div>

      <button class="btn btn-success w-100 mt-3" (click)="billSummary.checkout()">Checkout →</button>
    </div>

  </div>
<app-bill-summary
  [cartItems]="cartItems"
  [upiQrCode]="upiQrCode"
  (orderConfirmed)="handleOrderConfirmed($event)">
</app-bill-summary>

<div class="list">

  <div class="header">
    <h2>Products</h2>
    <button class="add-btn" routerLink="/admin/products/add">+ Add Product</button>
  </div>

  <div *ngIf="loading">Loading...</div>

  <!-- No Products -->
  <div *ngIf="!loading && products.length === 0" class="empty">
    <p>No products found.</p>
    <button routerLink="/admin/products/add" class="add-big">+ Add Your First Product</button>
  </div>

  <!-- Product List -->
  <div *ngIf="products.length > 0">
    <div *ngFor="let p of products" class="product-row">

      <div class="left">
        <img *ngIf="p.product.baseImage" [src]="p.product.baseImage" alt="" />
        <div *ngIf="!p.product.baseImage" class="no-img">No Image</div>
      </div>

      <div class="center">
        <div class="name">{{ p.product.name }}</div>
        <div class="brand">{{ p.product.brand }} • GST {{ p.product.gst }}%</div>
      </div>

      <div class="right">
        <div class="variants">{{ p.variantCount }} variants</div>
        <a [routerLink]="['/admin/products/edit', p.id]" class="edit-btn">Edit</a>
      </div>

    </div>
  </div>

</div>

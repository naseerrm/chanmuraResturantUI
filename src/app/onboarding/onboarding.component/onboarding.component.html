<div class="onboarding-container container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm border-0">

        <!-- Logo Section -->
        <div class="text-center p-4">
          <img src="assets/images/chanmura.jpg"
               alt="Chanmura Logo"
               class="company-logo">

          <h3 class="mt-3 text-primary fw-bold">Complete Business Details</h3>
          <p class="text-muted small">Please fill in your business information to proceed</p>
        </div>

        <div class="card-body px-4 pb-4">

          <form (ngSubmit)="submit()">

            <!-- Company Code -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Company Code</label>
              <input type="text"
                     class="form-control"
                     name="companyCode"
                     [(ngModel)]="companyCode"
                     required>
            </div>

            <!-- Business Name -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Business Name</label>
              <input type="text"
                     class="form-control"
                     name="businessName"
                     [(ngModel)]="businessName"
                     required>
            </div>

            <!-- Industry -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Industry</label>
              <select class="form-select"
                      name="industry"
                      [(ngModel)]="industry"
                      required>
                <option value="">Select industry</option>
                <option *ngFor="let i of industries" [value]="i">{{ i }}</option>
              </select>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Address</label>
              <textarea class="form-control"
                        rows="3"
                        name="address"
                        [(ngModel)]="address"></textarea>
            </div>

            <!-- GST -->
            <div class="mb-3">
              <label class="form-label fw-semibold">GST</label>
              <input type="text"
                     class="form-control"
                     name="gst"
                     [(ngModel)]="gst">
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button class="btn btn-primary btn-lg"
                      type="submit"
                      [disabled]="loading">
                <span *ngIf="!loading">Save & Continue</span>
                <span *ngIf="loading">Processing...</span>
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

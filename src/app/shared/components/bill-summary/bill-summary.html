<!-- BILL SUMMARY MODAL -->
<div class="modal fade" id="billModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title"><i class="bi bi-receipt"></i> Bill Summary</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">

        <!-- Items Table -->
        <div class="table-responsive">
          <table class="table table-sm table-striped align-middle">
            <thead class="table-light">
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of cartItems">
                <td>{{ item.menuItem.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>₹{{ item.menuItem.price }}</td>
                <td>₹{{ item.menuItem.price * item.quantity }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Summary -->
        <div class="bill-summary mt-3">
          <div class="summary-line"><span>Subtotal</span><strong>₹{{ subtotal }}</strong></div>
          <div class="summary-line"><span>CGST 2.5%</span><strong>₹{{ cgst }}</strong></div>
          <div class="summary-line"><span>SGST 2.5%</span><strong>₹{{ sgst }}</strong></div>
          <div class="summary-line fw-bold grand-total mt-2">
            <span>Grand Total</span><strong>₹{{ grandTotal }}</strong>
          </div>
        </div>

        <!-- UPI QR Code -->
        <div class="text-center mt-4" *ngIf="upiQrCode">
          <img [src]="upiQrCode" width="180" height="180" class="qr-code img-thumbnail" />
          <p class="small text-muted mt-2">Scan to Pay (UPI)</p>
        </div>

        <!-- Purchaser Info -->
        <div class="purchaser-info mt-4" *ngIf="cartItems.length > 0">
          <label>Purchaser Name:</label>
          <input type="text" [(ngModel)]="purchaserName" placeholder="Enter purchaser name" class="form-control mb-3" />

          <label>Mobile Number:</label>
          <input type="number" [(ngModel)]="mobileNumber" maxlength="10" pattern="[0-9]{10}" placeholder="Enter mobile number" class="form-control mb-3" />
        </div>

        <!-- Payment Method -->
        <div class="mb-3">
          <label for="paymentMethod" class="form-label">Payment Method</label>
          <select id="paymentMethod" class="form-select" [(ngModel)]="paymentMethod">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="UPI">UPI</option>
          </select>
        </div>

        <div class="mb-3" *ngIf="paymentMethod === 'Cash'">
          <label for="paidAmount" class="form-label">Amount Received</label>
          <input type="number" id="paidAmount" class="form-control" [(ngModel)]="paidAmount" />
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" (click)="confirmOrder()" [disabled]="loading()">
          {{ loading() ? 'Saving...' : 'Confirm & Print' }}
        </button>
      </div>

    </div>
  </div>
</div>

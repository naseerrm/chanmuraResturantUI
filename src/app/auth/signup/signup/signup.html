 <div class="signup-container">

    <!-- LEFT: SIGN UP FORM -->
    <div class="signup-form">
      <div class="logo-container">
        <img src="assets/images/chanmura.jpg" alt="Chanmura Logo" class="logo">
      </div>

      <h2>Create Account</h2>
      <p>Please fill the details to create a new account</p>

      <form #form="ngForm" (ngSubmit)="signup()">

        <div class="input-group">
          <input type="email" placeholder="Email ID" [(ngModel)]="email" name="email" required>
        </div>

        <div class="input-group">
          <input type="text" placeholder="Company Code (unique)" [(ngModel)]="companyCode" name="companyCode" required>
        </div>
        
        <div class="input-group">
           <label><input type="checkbox" [(ngModel)]="isOwner" name="isOwner" /> I am the owner / admin</label>
        </div>

        <div class="input-group">
          <input type="text" placeholder="Mobile Number" [(ngModel)]="mobile" name="mobile" required>
        </div>

        <div class="input-group">
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
        </div>

        <div class="input-group">
          <input type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </div>

        <button type="submit" [disabled]="loading" class="signup-btn">Create Account</button>
      </form>

      <p class="login-link">Already have an account? <a routerLink="/login">Login</a></p>
    </div>

    <!-- RIGHT: IMAGE -->
    <div class="visual-side">
      <img src="assets/images/chanmura.jpg" alt="Illustration" class="visual-image">
    </div>

  </div>

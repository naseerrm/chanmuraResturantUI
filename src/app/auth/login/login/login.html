<app-loader [isLoading]="isLoading"></app-loader>

<div class="login-container">
    <!-- Left side with the login form -->
    <div class="login-form">
      <div class="logo-container">
        <img src="assets/images/chanmura.jpg" alt="Chanmura Logo" class="logo">
      </div>
      <h2>WELCOME BACK</h2>
      <p>Welcome back! Please enter your details.</p>
      
      <form #form="ngForm" (ngSubmit)="login()">
        <div class="input-group">
          <input type="text" placeholder="Enter your email" [(ngModel)]="email" name="email" required />
        </div>
        <div class="input-group">
          <input type="password" placeholder="Enter your password" [(ngModel)]="password" name="password" required />
        </div>
        <div class="remember-forgot">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a routerLink="/forgotpassword" class="forgot-password">Forgot password?</a>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
        
        <button type="button" class="google-btn">
          <img src="assets/images/google-logo.png" alt="Google Logo" class="google-logo" /> Sign in with Google
        </button>
      </form>
      
      <p class="signup-link">Don’t have an account? <a routerLink="/signup">Sign up for free!</a></p>
    </div>

    <!-- Right side with the visual (could be an illustration or image) -->
    <div class="visual-side">
      <img src="assets/images/chanmura.jpg" alt="Visual Representation" class="visual-image">
    </div>
  </div>

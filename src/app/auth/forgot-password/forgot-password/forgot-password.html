<div class="forgot-container">

  <!-- LEFT SIDE FORM -->
 <div class="visual-side">
    <img src="assets/images/chanmura.png" alt="Illustration" class="visual-image">
  </div>

  <!-- RIGHT SIDE IMAGE -->
 
    <div class="forgot-form">
    <div class="form-card">

      <div class="logo-container">
        <img src="assets/images/chanmura.png" alt="Chanmura Logo" class="logo">
      </div>

      <h2>Forgot Password?</h2>
      <p>Enter your registered email and we will send you a reset link.</p>

      <form (ngSubmit)="submit()">
        <div class="input-group">
          <input type="email" placeholder="Email ID" [(ngModel)]="email" name="email" required />
        </div>

        <button type="submit" class="submit-btn">Send Reset Link</button>
      </form>

      <p class="back-link">
        <a routerLink="/login">Back to Login</a>
      </p>

    </div>
  </div>

</div>
